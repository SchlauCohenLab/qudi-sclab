#  Qudi configuration for CW ODMR and pulsed measurements on NV centres.
#
#  Hardware:
#    - Siglent SSG5060X-V RF signal generator      -> microwave source (ODMR + pulsed)
#    - NI R-series FPGA (e.g. PXI-7852R)            -> APD photon counting (ODMR)
#                                                     and digital pulse generation (pulsed)
#    - PicoQuant PicoHarp 300                       -> fast counter (pulsed)
#
#  Wiring assumed by this file (adapt channel numbers to your setup):
#    FPGA d_ch1 (pulser)        -> laser AOM
#    FPGA d_ch2 (pulser)        -> microwave switch
#    FPGA d_ch3 (pulser)        -> PicoHarp CH0 / sync input (sequence start)
#    FPGA count-window trigger  -> Siglent rear TRIGGER IN (steps one ODMR frequency per window)
#    APD                        -> FPGA counter input and PicoHarp CH1 (via a splitter)
#
#  IMPORTANT:
#    - The FPGA can only run one bitfile at a time. Photon counting and pulse generation must be
#      compiled into the same bitfile (see the docstrings of ni_r_series_instream.py and
#      ni_r_series_pulser.py for the required registers/FIFOs). Both modules below point at it.
#      Neither module resets the FPGA on activation, so activating one does not wipe the state
#      of the other.
#    - CW ODMR does not use the pulser. Make sure the laser and the microwave switch are open
#      during ODMR (e.g. hard-wired, or an "always on" pattern loaded in the pulsed GUI).
#    - The ODMR data rate is limited by the Siglent dwell time (>= 10 ms per point), so keep
#      "data rate x oversampling" at or below 100 Hz.
#    - The Siglent list sweep (JUMP_LIST, needed for multiple ranges or oversampling) holds at
#      most 500 points (points x oversampling). Single-range scans can use EQUIDISTANT_SWEEP
#      (step sweep) with up to 65535 points.

global:
    startup_modules: []

    remote_modules_server:
        address: 'localhost'
        port: 12345

    namespace_server_port: 18861

    force_remote_calls_by_value: True

    stylesheet: 'qdark.qss'

    daily_data_dirs: True

gui:

    odmr_gui:
        module.Class: 'odmr.odmrgui.OdmrGui'
        connect:
            odmr_logic: 'odmr_logic'

    pulsed_gui:
        module.Class: 'pulsed.pulsed_maingui.PulsedMeasurementGui'
        connect:
            pulsedmasterlogic: 'pulsed_master_logic'

logic:

    odmr_logic:
        module.Class: 'odmr_logic.OdmrLogic'
        options:
            default_scan_mode: 'JUMP_LIST'  # or 'EQUIDISTANT_SWEEP' (step sweep on the Siglent)
        connect:
            microwave: 'mw_source_siglent'
            data_scanner: 'odmr_sampler'

    pulsed_master_logic:
        module.Class: 'pulsed.pulsed_master_logic.PulsedMasterLogic'
        connect:
            pulsedmeasurementlogic: 'pulsed_measurement_logic'
            sequencegeneratorlogic: 'sequence_generator_logic'

    pulsed_measurement_logic:
        module.Class: 'pulsed.pulsed_measurement_logic.PulsedMeasurementLogic'
        connect:
            fastcounter: 'fastcounter_picoharp300'
            pulsegenerator: 'nicard_pulser'
            microwave: 'mw_source_siglent'

    sequence_generator_logic:
        module.Class: 'pulsed.sequence_generator_logic.SequenceGeneratorLogic'
        options:
            disable_benchmark_prompt: True  # waveforms are tiny once run-length encoded
        connect:
            pulsegenerator: 'nicard_pulser'

hardware:

    mw_source_siglent:
        module.Class: 'microwave.mw_source_siglent_ssg5000x.MicrowaveSiglentSSG5000X'
        options:
            visa_address: 'TCPIP0::192.168.1.100::inst0::INSTR'  # TODO: your instrument address
            comm_timeout: 10
            trigger_edge: 'rising'
            # frequency and level limits are read from the model (*IDN?). Uncomment to narrow
            # them, e.g. to protect an amplifier:
            # frequency_limits: [2.5e9, 3.2e9]
            # power_limits: [-140, 0]
            scan_sample_rate_limits: [0.01, 100]
            reset_on_activate: False

    odmr_sampler:
        module.Class: 'interfuse.instream_finite_sampling_interfuse.InStreamFiniteSamplingInterfuse'
        options:
            discard_samples: 0  # increase if the first ODMR point is misaligned
        connect:
            streamer: 'nicard_apd_instreamer'

    nicard_apd_instreamer:
        module.Class: 'ni_card.ni_r_series_instream.NIRSeriesFPGAInStreamer'
        options:
            resource_name: 'RIO0'  # as shown in NI MAX
            bitfile_path: 'C:/qudi_fpga_bitfiles/NV_Main.lvbitx'  # TODO: combined counter + pulser bitfile
            digital_sources:
                'apd': 'PhotonCount'
            fpga_clock_frequency: 40e6
            sample_clock_register: 'Count time [us]'
            sample_clock_units: 'us'
            stabilization_period_us_register: 'Stabilization period [us]'
            stabilization_period_us: 0.0  # settling time after each frequency step
            acquisition_control_register: 'Gate'
            min_sample_rate: 1.0
            max_sample_rate: 1e5
            max_channel_samples_buffer: 10000000
            read_write_timeout: 10
            reset_on_activate: False  # do not wipe the pulse pattern of nicard_pulser

    nicard_pulser:
        module.Class: 'ni_card.ni_r_series_pulser.NIRSeriesFPGAPulser'
        options:
            resource_name: 'RIO0'
            bitfile_path: 'C:/qudi_fpga_bitfiles/NV_Main.lvbitx'  # same bitfile as the instreamer
            fpga_clock_frequency: 40e6
            digital_channel_count: 8
            digital_high_level: 3.3
            min_instruction_ticks: 4  # TODO: minimum state duration of your playback loop
            max_instructions: 4096  # TODO: size of the instruction block memory
            max_sample_rate_divider: 1000
            pattern_fifo: 'Pattern'
            load_register: 'Load'
            loaded_count_register: 'Loaded instructions'
            pattern_length_register: 'Pattern length'
            run_register: 'Run'
            reset_on_activate: False
            read_write_timeout: 10
            activation_config:
                'laser_mw_sync': ['d_ch1', 'd_ch2', 'd_ch3']
                'all': ['d_ch1', 'd_ch2', 'd_ch3', 'd_ch4', 'd_ch5', 'd_ch6', 'd_ch7', 'd_ch8']

    fastcounter_picoharp300:
        module.Class: 'picoquant.picoharp300.PicoHarp300'
        options:
            deviceID: 0  # device index from 0 to 7
            mode: 0  # 0: histogram mode
            dll_path: 'C:/Windows/System32/phlib64.dll'
